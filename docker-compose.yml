services:
  mongo:
    image: mongo:8.3.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  ingest-api:
    build:
      context: .
      dockerfile: src/Ingest.Api/Dockerfile
      target: runtime
    ports:
      - "8080:8080"
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: polyglotpipeline
    depends_on:
      - mongo

volumes:
  mongo-data:
