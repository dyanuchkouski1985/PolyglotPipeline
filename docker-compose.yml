services:
  mongo:
    image: mongo:8.3.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  rabbitmq:
    image: rabbitmq:4.3.4-management
    ports:
      - "5672:5672"
      - "15672:15672"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      - kafka

  redis:
    image: redis:8.10.0
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ingest-api:
    build:
      context: .
      dockerfile: src/Ingest.Api/Dockerfile
      target: runtime
    ports:
      - "8080:8080"
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: polyglotpipeline
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
      Kafka__BootstrapServers: kafka:19092
    depends_on:
      - mongo
      - rabbitmq
      - kafka

  redis-indexer:
    build:
      context: .
      dockerfile: src/RedisIndexer.Worker/Dockerfile
    environment:
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
      Kafka__BootstrapServers: kafka:19092
      Redis__ConnectionString: redis:6379
    depends_on:
      - rabbitmq
      - kafka
      - redis

volumes:
  mongo-data:
  redis-data:
